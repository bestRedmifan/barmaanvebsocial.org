<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>Posts Viewer</title>

  <!-- اتصال به فایل استایل -->
  <link rel="stylesheet" href="style.css">

  <!-- سازگاری موبایل -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

  <!-- هدر سایت -->
  <header class="header">
    <div class="logo">
      <div class="logo-icon">P</div>
      <div class="logo-texts">
        <div class="logo-main">Posts Viewer</div>
        <div class="logo-sub">Reading from posts.json only</div>
      </div>
    </div>

    <!-- دکمه‌های فیلتر -->
    <div class="filters">
      <button class="filter-btn active" data-filter="all">همه</button>
      <button class="filter-btn" data-filter="Short">Short</button>
      <button class="filter-btn" data-filter="ShortNews">Short news</button>
      <button class="filter-btn" data-filter="Photo">Photo</button>
      <button class="filter-btn" data-filter="Text">Text</button>
      <button class="filter-btn" data-filter="Poll">Poll</button>
    </div>
  </header>

  <!-- بخش اصلی -->
  <main class="main">

    <!-- وضعیت بارگذاری -->
    <div class="status-bar">
      <span id="status-text">در حال بارگذاری...</span>
    </div>

    <!-- محل نمایش پست‌ها -->
    <div id="posts-root" class="posts-container"></div>

  </main>

  <!-- اتصال به فایل جاوااسکریپت -->
  <script src="script.js"></script>

</body>
</html>
