<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barmaan Social Media</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>📱 Barmaan Social Media</h1>
  <p>Frontend-only • GMT+3:30</p>
</header>

<main>
  <section class="card">
    <h2>Create post</h2>
    <div id="steps"></div>
  </section>

  <section>
    <h2>Feed</h2>
    <div id="feed"></div>
  </section>

  <button class="adminBtn" onclick="openAdmin()">⚙️ Admin</button>
</main>

<dialog id="admin">
  <div class="card">
    <button class="x" onclick="admin.close()">×</button>
    <div id="adminBox"></div>
  </div>
</dialog>

<script src="script.js"></script>
</body>
