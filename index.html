<!doctype html>

<html lang="en"><head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"><meta
name="description"
content="Barmaan Social Media">

  <title>Barmaan Social Media</title>  <link
    rel="stylesheet"
    href="style.css">
</head><body>  <header class="siteHeader"><div class="headerInner">

  <h1>
    📱 Barmaan Social Media
  </h1>

  <p>
    Shared posts • GMT+3:30
  </p>

</div>

  </header>  <main class="page"><!-- Create Post is permanently open -->
<section class="card createCard">

  <div class="sectionTitle">

    <h2>
      Create post
    </h2>

    <span
      class="statusDot"
      title="Create post is ready">
    </span>

  </div>

  <div id="steps">

    <label>
      1. Select subject
    </label>

    <div
      class="subjectButtons"
      id="subjectButtons">

      <button
        type="button"
        class="subjectButton active"
        data-type="Short"
        onclick="selectSubject('Short')">
        Short
      </button>

      <button
        type="button"
        class="subjectButton"
        data-type="News Short"
        onclick="selectSubject('News Short')">
        News Short
      </button>

      <button
        type="button"
        class="subjectButton"
        data-type="Photo"
        onclick="selectSubject('Photo')">
        Photo
      </button>

      <button
        type="button"
        class="subjectButton"
        data-type="Poll"
        onclick="selectSubject('Poll')">
        Poll
      </button>

      <button
        type="button"
        class="subjectButton"
        data-type="Text"
        onclick="selectSubject('Text')">
        Text
      </button>

      <button
        type="button"
        class="subjectButton publicButton"
        onclick="openPublicError()">
        Public
      </button>

    </div>

    <div
      id="form"
      class="postForm">
    </div>

  </div>

</section>

<!-- Feed -->
<section class="feedSection">

  <div class="sectionTitle">

    <h2>
      Feed
    </h2>

    <button
      class="refreshButton"
      type="button"
      onclick="loadSharedPosts()">
      ↻ Refresh
    </button>

  </div>

  <div id="feed">

    <p class="muted">
      Loading shared posts...
    </p>

  </div>

</section>

  </main>  <!-- Public error -->  <dialog
    id="publicDialog"
    class="publicDialog"><div class="errorCard">

  <div class="errorIcon">
    🚫
  </div>

  <h2>
    ERROR 403
  </h2>

  <p class="errorMain">
    You don't have permission to do this
  </p>

  <p class="errorSmall">
    thats all we know
  </p>

  <button
    class="backButton"
    type="button"
    onclick="closePublicError()">
    ← Back
  </button>

</div>

  </dialog>  <script src="script.js"></script>  <script>

    async function loadSharedPosts() {

      const feed =
        document.getElementById("feed");

      feed.innerHTML =
        "<p class='muted'>" +
        "Loading shared posts..." +
        "</p>";

      try {

        const response =
          await fetch(
            "posts.json",
            {
              cache: "no-store"
            }
          );

        if (!response.ok) {

          throw new Error(
            "posts.json could not be loaded"
          );

        }

        const data =
          await response.json();

        if (
          !data.posts ||
          !Array.isArray(data.posts) ||
          data.posts.length === 0
        ) {

          feed.innerHTML =
            "<p class='muted emptyState'>" +
            "No shared posts yet." +
            "</p>";

          return;

        }

        feed.innerHTML = "";

        data.posts.forEach(
          post => {

            const article =
              document.createElement(
                "article"
              );

            article.className =
              "post";

            const title =
              document.createElement(
                "div"
              );

            title.innerHTML =
              "<span class='tag'>" +
              escapeHTML(
                post.type || "Post"
              ) +
              "</span>";

            article.appendChild(title);

            if (post.caption) {

              const caption =
                document.createElement(
                  "p"
                );

              caption.textContent =
                post.caption;

              article.appendChild(
                caption
              );

            }

            if (
              post.mediaType ===
                "video/mp4" &&
              post.media
            ) {

              const video =
                document.createElement(
                  "video"
                );

              video.controls = true;
              video.playsInline = true;
              video.preload = "metadata";
              video.src = post.media;

              article.appendChild(
                video
              );

            }

            if (post.createdAt) {

              const time =
                document.createElement(
                  "small"
                );

              time.textContent =
                "Posted: " +
                post.createdAt;

              article.appendChild(
                time
              );

            }

            feed.appendChild(
              article
            );

          }
        );

      }
      catch (error) {

        console.error(error);

        feed.innerHTML =
          "<p class='muted'>" +
          "Unable to load shared posts." +
          "</p>";

      }

    }

    function escapeHTML(text) {

      const div =
        document.createElement(
          "div"
        );

      div.textContent = text;

      return div.innerHTML;

    }

    function openPublicError() {

      const dialog =
        document.getElementById(
          "publicDialog"
        );

      if (!dialog) {
        return;
      }

      dialog.showModal();

    }

    function closePublicError() {

      const dialog =
        document.getElementById(
          "publicDialog"
        );

      if (!dialog) {
        return;
      }

      if (dialog.open) {
        dialog.close();
      }

    }

    loadSharedPosts();

  </script></body></html>
