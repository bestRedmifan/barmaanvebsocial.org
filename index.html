<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>Posts Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="logo">
      <div class="logo-icon">P</div>
      <div class="logo-texts">
        <div class="logo-main">Posts Viewer</div>
        <div class="logo-sub">فقط خواندن از posts.json · بدون admin · بدون create post</div>
      </div>
    </div>
    <div class="filters">
      <button class="filter-btn active" data-filter="all">
        <span class="dot"></span>
        همه
      </button>
      <button class="filter-btn" data-filter="shorts">
        <span class="dot"></span>
        Shorts
      </button>
      <button class="filter-btn" data-filter="short_news">
        <span class="dot"></span>
        Short news
      </button>
      <button class="filter-btn" data-filter="photo">
        <span class="dot"></span>
        Photo
      </button>
      <button class="filter-btn" data-filter="text">
        <span class="dot"></span>
        Text
      </button>
      <button class="filter-btn" data-filter="poll">
        <span class="dot"></span>
        Poll
      </button>
    </div>
  </header>

  <main class="main">
    <div class="status-bar">
      <div class="status-dot"></div>
      <span id="status-text">در حال بارگذاری از posts.json...</span>
    </div>
    <div id="posts-root" class="posts-container"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
